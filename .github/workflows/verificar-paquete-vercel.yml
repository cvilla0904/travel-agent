name: Verificación final (dependencias y paquete de funciones)

# Sin despliegue, sin claves y sin proveedores. Comprueba en la MISMA instalación (npm ci) que basic-ftp es 6.2.6 y npm audit da 0,
# estima el tamaño de las funciones de Vercel y ejecuta las consultas de api/geo sobre un /var/task emulado.
on:
  workflow_dispatch:
  push:
    branches: [feat/integracion-catalogo-geografico]
    paths:
      - .github/workflows/verificar-paquete-vercel.yml
      - scripts/verificar-paquete-vercel.mjs

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependencias (misma instalación que el CI)
        run: |
          echo "commit: $(git rev-parse --short HEAD)"
          echo "lockfile: $(node -e "console.log(require('./package-lock.json').packages['node_modules/basic-ftp'].version)")"
          echo "package.json overrides: $(node -e "console.log(JSON.stringify(require('./package.json').overrides))")"
          echo "instalado en disco: $(node -e "console.log(require('basic-ftp/package.json').version)")"
          npm ls basic-ftp
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json');console.log('npm audit:',JSON.stringify(a.metadata.vulnerabilities))"
          npm audit || true
      - name: Paquete de las funciones de Vercel y consultas a api/geo
        run: |
          npm i --no-save @vercel/nft >/dev/null 2>&1
          node scripts/verificar-paquete-vercel.mjs | tee informe-paquete.txt
