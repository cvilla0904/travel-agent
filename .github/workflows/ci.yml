name: CI

on:
  push:
    branches:
      - integration/cierre-mogavel
      - feat/integracion-catalogo-geografico
  pull_request:
    branches:
      - integration/cierre-mogavel
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Test suite
        run: npm test
